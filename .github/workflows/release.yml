name: Release packages

on:
  push:
    tags: ["v*", "V*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate release version
        id: version
        shell: bash
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          source scripts/packaging-common.sh
          packaging_init
          if [[ "$RELEASE_REF" == refs/tags/* && "$RELEASE_TAG" != "v$VERSION" ]]; then
            die "Tag $RELEASE_TAG must match Cargo.toml version v$VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - name: Build Windows x64 installer
        shell: cmd
        run: scripts\build-windows.bat
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows-x64
          path: dist/*.exe
          if-no-files-found: error
          compression-level: 0

  macos:
    needs: version
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - name: Install icon packaging tool
        run: command -v magick >/dev/null || brew install imagemagick
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p pomelo-core -p pomelo-import --locked
      - run: cargo test -p pomelo-render --features native-gpu --lib --locked
      - name: Build macOS app, ZIP and DMG
        run: scripts/build-macos.sh
      - name: Verify packaged app
        run: |
          mkdir -p "$RUNNER_TEMP/pomelo-verify"
          ditto -x -k dist/*.app.zip "$RUNNER_TEMP/pomelo-verify"
          codesign --verify --deep --strict "$RUNNER_TEMP/pomelo-verify/Pomelo.app"
          test "$("$RUNNER_TEMP/pomelo-verify/Pomelo.app/Contents/MacOS/pomelo" --version)" = "Pomelo $RELEASE_VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: release-macos-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.app.zip
          if-no-files-found: error
          compression-level: 0

  ubuntu:
    needs: version
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - name: Install native build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config clang libclang-dev dpkg-dev desktop-file-utils \
            libasound2-dev libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libxcb1-dev libx11-xcb-dev libssl-dev libvulkan-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p pomelo-core -p pomelo-import --locked
      - run: cargo test -p pomelo-render --features native-gpu --lib --locked
      - name: Build Ubuntu DEB and archive
        run: scripts/build-ubuntu.sh
      - name: Install and verify DEB on Ubuntu 24.04
        run: |
          sudo apt-get install -y ./dist/*.deb
          test "$(pomelo --version)" = "Pomelo $RELEASE_VERSION"
          ldd /usr/bin/pomelo
          if ldd /usr/bin/pomelo | grep -q 'not found'; then exit 1; fi
      - uses: actions/upload-artifact@v7
        with:
          name: release-ubuntu-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0

  ubuntu-newer:
    needs: [version, ubuntu]
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    container: ubuntu:26.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-ubuntu-${{ matrix.arch }}
          path: dist
      - name: Install Ubuntu 24.04 package on Ubuntu 26.04
        shell: bash
        run: |
          apt-get update
          apt-get install -y ./dist/*.deb
          test "$(pomelo --version)" = "Pomelo $RELEASE_VERSION"
          ldd /usr/bin/pomelo
          if ldd /usr/bin/pomelo | grep -q 'not found'; then exit 1; fi

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [version, windows, macos, ubuntu, ubuntu-newer]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Publish release assets and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          cd dist
          sha256sum ./* > SHA256SUMS
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            options=()
            if [[ "$RELEASE_VERSION" == *-* ]]; then options+=(--prerelease); fi
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "Pomelo $RELEASE_VERSION" --generate-notes "${options[@]}"
          fi
          gh release upload "$RELEASE_TAG" ./* --repo "$GITHUB_REPOSITORY" --clobber
