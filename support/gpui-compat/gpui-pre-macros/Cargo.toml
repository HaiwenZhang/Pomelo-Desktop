# Package-name compatibility for GPUI Kit 0.7.0. All types come from the workspace fork.
[package]
name = "gpui-pre-macros"
version = "0.3.7"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
path = "lib.rs"

[dependencies]
gpui-macros.workspace = true

[features]
inspector = ["gpui-macros/inspector"]
