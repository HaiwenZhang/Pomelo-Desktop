[workspace]
resolver = "3"
members = [
    "crates/pomelo-core",
    "crates/pomelo-import",
    "crates/pomelo-render",
    "crates/pomelo",
    "support/gpui-compat/*",
]
default-members = ["crates/pomelo-core", "crates/pomelo-import", "crates/pomelo-render"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"

[workspace.dependencies]
# Local crates
pomelo-core = { path = "crates/pomelo-core" }
pomelo-import = { path = "crates/pomelo-import" }
pomelo-render = { path = "crates/pomelo-render" }

# GPUI Kit and native GPU backends
gpui-kit = "=0.7.0"
gpui = { git = "https://github.com/HaiwenZhang/zed.git", branch = "gpui-pre-0.3.7-native-gpu", default-features = false }
gpui-apple = { package = "gpui_apple", git = "https://github.com/HaiwenZhang/zed.git", branch = "gpui-pre-0.3.7-native-gpu", default-features = false }
gpui-wgpu = { package = "gpui_wgpu", git = "https://github.com/HaiwenZhang/zed.git", branch = "gpui-pre-0.3.7-native-gpu", default-features = false }
gpui-windows = { package = "gpui_windows", git = "https://github.com/HaiwenZhang/zed.git", branch = "gpui-pre-0.3.7-native-gpu", default-features = false }

# GPUI Kit package-name bridges
gpui-macros = { package = "gpui_macros", git = "https://github.com/HaiwenZhang/zed.git", branch = "gpui-pre-0.3.7-native-gpu", default-features = false }
gpui-platform = { package = "gpui_platform", git = "https://github.com/HaiwenZhang/zed.git", branch = "gpui-pre-0.3.7-native-gpu", default-features = false }
sum-tree = { package = "sum_tree", git = "https://github.com/HaiwenZhang/zed.git", branch = "gpui-pre-0.3.7-native-gpu", default-features = false }

# Geometry and collation
earcut = "=0.4.11"
icu_collator = { version = "=2.1.1", default-features = false, features = ["serde"] }
icu_locale_core = "=2.3.0"
icu_provider = { version = "=2.3.1", default-features = false, features = ["sync"] }
icu_provider_blob = { version = "=2.1.1", features = ["alloc"] }

# Serialization, localization, and utilities
anyhow = "1.0"
base64 = "=0.22.1"
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
dirs = "6"
encoding_rs = "0.8"
futures = "0.3"
image = { version = "0.25.10", default-features = false, features = ["png"] }
rust-i18n = "=4.2.4"
serde = { version = "1.0", features = ["derive", "rc"] }
serde-saphyr = "1.3"
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.10"
syn = { version = "2", features = ["full", "visit"] }
sys-locale = "0.3"
tempfile = "3"
thiserror = "2.0"

# Platform and build tools
bytemuck = { version = "1", features = ["derive"] }
embed-resource = "=3.0.11"
metal = "0.33"
naga = { version = "29.0.4", features = ["wgsl-in"] }
resvg = { version = "=0.46.0", default-features = false }
rfd = { version = "=0.17.2", default-features = false, features = ["common-controls-v6"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }

# GPUI Kit uses the gpui-pre package names. These crates only re-export
# the fork above; no GPUI or GPUI Kit source patches are applied.
[patch.crates-io]
gpui-pre = { path = "support/gpui-compat/gpui-pre" }
gpui-pre-platform = { path = "support/gpui-compat/gpui-pre-platform" }
gpui-pre-macros = { path = "support/gpui-compat/gpui-pre-macros" }
gpui-pre-sum-tree = { path = "support/gpui-compat/gpui-pre-sum-tree" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
