[workspace]
resolver = "3"
members = ["crates/pomelo-core", "crates/pomelo-import", "crates/pomelo-render", "crates/pomelo"]
default-members = ["crates/pomelo-core", "crates/pomelo-import", "crates/pomelo-render"]
exclude = [".cache/gpui/gpui-pre", ".cache/gpui/gpui-pre-windows"]

[patch.crates-io]
gpui-pre = { path = ".cache/gpui/gpui-pre" }
gpui-pre-windows = { path = ".cache/gpui/gpui-pre-windows" }

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"

[workspace.dependencies]
pomelo-core = { path = "crates/pomelo-core" }
pomelo-import = { path = "crates/pomelo-import" }
pomelo-render = { path = "crates/pomelo-render" }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
encoding_rs = "0.8"
earcut = "=0.4.11"
sha2 = "0.10"
gpui-kit = "=0.7.0"
wgpu = "=30.0.1"
pollster = "0.4"
rust-i18n = "=4.2.4"
sys-locale = "0.3"
dirs = "6"
tempfile = "3"
serde-saphyr = "1.3"
syn = { version = "2", features = ["full", "visit"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
