[workspace]
resolver = "3"
members = [
  "crates/pomelo-core",
  "crates/pomelo-import",
  "crates/pomelo-render",
  "crates/pomelo",
]
default-members = [
  "crates/pomelo-core",
  "crates/pomelo-import",
  "crates/pomelo-render",
]

[workspace.package]
version = "0.3.2"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"

[workspace.dependencies]
regex = { version = "1.13", default-features = false, features = ["std", "unicode-case", "unicode-perl"] }
# Local crates
pomelo-core = { path = "crates/pomelo-core" }
pomelo-import = { path = "crates/pomelo-import" }
pomelo-render = { path = "crates/pomelo-render" }

# solidcore B-rep kernel, only for the optional `kernel-3d` comparison experiment
# (docs/pcb-3d-solidcore-experiment-plan.md). Pinned: the API is experimental.
solidcore = { git = "https://github.com/tangency-labs/solidcore", rev = "6833c2eb54514f6f8fe51fa0b75b564eed4ae459" }
solidcore-convert = { git = "https://github.com/tangency-labs/solidcore", rev = "6833c2eb54514f6f8fe51fa0b75b564eed4ae459" }
solidcore-ops = { git = "https://github.com/tangency-labs/solidcore", rev = "6833c2eb54514f6f8fe51fa0b75b564eed4ae459" }
solidcore-record = { git = "https://github.com/tangency-labs/solidcore", rev = "6833c2eb54514f6f8fe51fa0b75b564eed4ae459" }
solidcore-tess = { git = "https://github.com/tangency-labs/solidcore", rev = "6833c2eb54514f6f8fe51fa0b75b564eed4ae459" }

# GPUI Kit and native GPU backends
gpui-kit = "=0.8.0"
gpui = { git = "https://github.com/HaiwenZhang/gpui-fast.git", branch = "native-gpu", default-features = false }
gpui-apple = { package = "gpui_apple", git = "https://github.com/HaiwenZhang/gpui-fast.git", branch = "native-gpu", default-features = false }
gpui-wgpu = { package = "gpui_wgpu", git = "https://github.com/HaiwenZhang/gpui-fast.git", branch = "native-gpu", default-features = false }
gpui-windows = { package = "gpui_windows", git = "https://github.com/HaiwenZhang/gpui-fast.git", branch = "native-gpu", default-features = false }

# Geometry and collation
clipper2-rust = "=1.2.0"
earcut = "=0.4.11"
spade = "=2.15.1"
icu_collator = { version = "=2.3.1", default-features = false, features = [
  "serde",
] }
icu_locale_core = "=2.3.0"
icu_provider = { version = "=2.3.1", default-features = false, features = [
  "sync",
] }
icu_provider_blob = { version = "=2.3.0", features = ["alloc"] }

# Serialization, localization, and utilities
anyhow = "1.0"
base64 = "=0.23.1"
chrono = { version = "=0.4.45", default-features = false, features = [
  "clock",
  "std",
] }
dirs = "7.0.0"
encoding_rs = "0.8"
futures = "0.3"
image = { version = "0.25.10", default-features = false, features = ["png"] }
rust-i18n = "=4.2.4"
serde = { version = "1.0", features = ["derive", "rc"] }
serde-saphyr = "1.3"
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.11"
hex = "0.4.3"
syn = { version = "3.0.6", features = ["full", "visit"] }
sys-locale = "0.3"
tempfile = "3"
thiserror = "2.0"

# Platform and build tools
bytemuck = { version = "1", features = ["derive"] }
embed-resource = "=3.0.11"
metal = "0.33"
naga = { version = "30.0.1", features = ["wgsl-in"] }
resvg = { version = "=0.48.1", default-features = false, features = ["raster-images"] }
rfd = { version = "=0.17.2", default-features = false, features = [
  "common-controls-v6",
] }
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Direct3D_Fxc",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
] }

# GPUI Kit's gpui-pre packages re-export the same native-gpu fork.
# Use the fork's compatibility crates to keep UI and GPU types identical.
[patch.crates-io]
gpui-pre = { git = "https://github.com/HaiwenZhang/gpui-fast.git", branch = "native-gpu" }
gpui-pre-platform = { git = "https://github.com/HaiwenZhang/gpui-fast.git", branch = "native-gpu" }
gpui-pre-macros = { git = "https://github.com/HaiwenZhang/gpui-fast.git", branch = "native-gpu" }
gpui-pre-sum-tree = { git = "https://github.com/HaiwenZhang/gpui-fast.git", branch = "native-gpu" }
gpui-pre-web = { git = "https://github.com/HaiwenZhang/gpui-fast.git", branch = "native-gpu" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
