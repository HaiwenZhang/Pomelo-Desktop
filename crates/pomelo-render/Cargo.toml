[package]
name = "pomelo-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
frame-profiling = []
# Experimental: solid meshes built through the solidcore B-rep kernel for comparison.
kernel-3d = [
    "dep:solidcore",
    "dep:solidcore-convert",
    "dep:solidcore-ops",
    "dep:solidcore-record",
    "dep:solidcore-tess",
]
native-gpu = [
    "dep:anyhow",
    "dep:gpui",
    "dep:gpui-apple",
    "dep:gpui-wgpu",
    "dep:gpui-windows",
    "dep:metal",
    "dep:naga",
    "dep:windows",
]

[dependencies]
pomelo-core.workspace = true
thiserror.workspace = true
bytemuck.workspace = true
clipper2-rust.workspace = true
serde.workspace = true
serde_json.workspace = true
sysinfo = { version = "=0.31.4", default-features = false, features = ["system"] }
image.workspace = true
base64.workspace = true
solidcore = { workspace = true, optional = true }
solidcore-convert = { workspace = true, optional = true }
solidcore-ops = { workspace = true, optional = true }
solidcore-record = { workspace = true, optional = true }
solidcore-tess = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
gpui = { workspace = true, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
gpui-windows = { workspace = true, optional = true }
naga = { workspace = true, optional = true, features = ["hlsl-out"] }
windows = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
gpui-apple = { workspace = true, optional = true, features = ["runtime_shaders"] }
naga = { workspace = true, optional = true, features = ["msl-out"] }
metal = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
gpui-wgpu = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
futures.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc = "=0.2.7"

[dev-dependencies]
resvg.workspace = true
naga = { workspace = true, features = ["msl-out", "hlsl-out"] }
sha2.workspace = true
hex.workspace = true
pomelo-import.workspace = true
anyhow.workspace = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[[example]]
name = "kernel_k2"
required-features = ["kernel-3d"]

[[example]]
name = "kernel_k3"
required-features = ["kernel-3d"]
